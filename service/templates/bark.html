<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><meta name="robots" content="noindex,nofollow,noarchive">
<title>Bark · 每日复盘</title>
<style>
:root{--bg:#f8f7f3;--paper:#fff;--text:#252923;--muted:#757a70;--line:#e4e5dc;--accent:#52764b;--orange:#bd7138}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}.wrap{max-width:1400px;margin:auto;padding:36px 40px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.brand{display:flex;gap:14px;align-items:center}.mark{background:#f0decd;color:var(--orange);width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:24px}h1{font-size:28px;letter-spacing:-.5px;margin:0}h2{font-size:23px;margin:0}h3{font-size:17px;margin:0}.small{font-size:12px;color:var(--muted)}p{margin:4px 0}button,input,select,textarea{font:inherit}button{border:1px solid var(--line);background:white;color:var(--text);padding:9px 14px;border-radius:9px;cursor:pointer;min-height:42px}button:hover{background:#f1f3ed}button:disabled{opacity:.6;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #b7cfab;outline-offset:3px}.primary{background:var(--accent);border-color:var(--accent);color:white}.primary:hover{background:#41603a}.layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:34px}aside{max-height:80vh;overflow:auto;padding:2px}.daybtn{display:block;width:100%;text-align:left;margin:0 0 8px;padding:12px 14px;background:transparent;border-color:transparent}.daybtn b{display:block}.daybtn[aria-current=date]{background:#e9eee3;border-color:#d5dfcc}.daybtn span{display:block}.dayhead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}.tools{padding:18px;border:1px solid var(--line);border-radius:13px;background:var(--paper);margin-bottom:20px}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{display:block;font-size:12px;color:var(--muted)}.search{flex:1;min-width:180px}.filters input:not([type=checkbox]),.filters select{width:100%;border:1px solid var(--line);border-radius:8px;background:white;color:var(--text);padding:9px 11px;min-height:42px}.all{display:flex;gap:7px;align-items:center;margin:10px 0 0;font-size:13px}input[type=checkbox]{accent-color:var(--accent)}.review{padding:20px;border:1px solid var(--line);border-radius:13px;background:#f3f5ef;margin-bottom:26px}.review label{font-size:16px;font-weight:600;color:var(--text)}textarea{display:block;width:100%;min-height:135px;padding:12px 14px;border:1px solid #d9e1d1;border-radius:9px;background:#fff;color:var(--text);resize:vertical;margin-top:10px}.review-bottom{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:12px}.timeline-title{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:16px}.message{border:1px solid var(--line);border-radius:12px;background:var(--paper);margin-bottom:13px;padding:18px 20px;overflow-wrap:anywhere}.message-head{display:flex;justify-content:space-between;gap:15px;align-items:baseline}.tags{display:flex;gap:9px;flex-wrap:wrap;margin:8px 0 12px;font-size:12px;color:var(--muted)}.pill{padding:1px 7px;border-radius:5px;background:#edf1e7;color:#59754d}.status{font-size:11px;border-radius:5px;padding:2px 7px;white-space:nowrap;background:#eef2e9;color:#59754d}.status.unknown,.status.pending{background:#fff1d9;color:#9b7223}.status.failed{background:#faeae5;color:#aa5542}.body{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.85}.body a{color:var(--accent)}details{margin-top:7px}summary{cursor:pointer;font-size:12px;color:var(--accent);padding:5px 0}.origin{margin-top:13px;padding-top:10px;border-top:1px solid #f0f0eb;font-size:11px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:40px 24px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted)}.error{background:#fff0eb;border:1px solid #edc9ba;padding:12px 16px;border-radius:9px;color:#9f4c35;margin-bottom:20px}.pager{display:flex;justify-content:center;margin:22px 0}.mobile-date{display:none}footer{border-top:1px solid var(--line);margin-top:28px;padding-top:14px;color:var(--muted);font-size:11px}[hidden]{display:none!important}
@media(max-width:760px){.wrap{padding:22px 17px}.layout{display:block}aside{display:none}.mobile-date{display:block;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:white;margin-bottom:18px}.brand{gap:10px}h1{font-size:25px}.mark{width:42px;height:42px}.dayhead{gap:10px}h2{font-size:21px}.filters>div{flex:1;min-width:135px}.filters .search{flex-basis:100%}.tools,.review{padding:15px}.message{padding:15px}.message-head{display:block}.status{display:inline-block;margin-top:5px}.review-bottom{align-items:flex-start}.dayhead .small{max-width:170px;text-align:right}}
.preferences{margin:-8px 0 20px;border:1px solid var(--line);border-radius:10px;background:white;padding:10px 16px}.preferences summary{color:var(--text);font-size:13px}.pref-options{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0}.pref-options label{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--text)}.preferences input[type=text]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;margin:6px 0}.pref-bottom{display:flex;gap:15px;align-items:center;justify-content:space-between;margin-top:10px}.hidden-tag{background:#fff1d9;color:#9b7223}
</style>
</head>
<body><div class="wrap">
<header><div class="brand"><div class="mark" aria-hidden="true">↗</div><div><h1>Bark</h1><p class="small">推送留痕，每日复盘</p></div></div><button id="refresh" type="button">刷新</button></header>
<div id="error" class="error" role="alert" hidden></div>
<div class="layout"><aside id="dates" aria-label="历史日期"></aside><main>
<select id="mobile-date" class="mobile-date" aria-label="选择日期"></select>
<div class="dayhead"><div><h2 id="date-title">正在读取…</h2><p id="date-info" class="small"></p></div><p id="latest" class="small"></p></div>
<form id="filters" class="tools"><div class="filters">
<div class="search"><label for="q">搜索正文、标题或来源</label><input id="q" type="search" maxlength="200" placeholder="输入关键词，回看具体过程…"></div>
<div><label for="group">群组</label><select id="group"><option value="">全部群组</option></select></div>
<div><label for="source">来源</label><select id="source"><option value="">全部来源</option></select></div>
<button class="primary" type="submit">查找</button></div><label class="all"><input id="filter-unrelated" type="checkbox" checked>过滤无关通知 <span class="small">JD、顺丰、CK 等</span></label><label class="all"><input id="all-dates" type="checkbox">查找所有日期</label></form>
<details class="preferences"><summary>过滤设置</summary><div id="hidden-categories" class="pref-options"></div><label for="hidden-keywords">其他想过滤的关键词</label><input id="hidden-keywords" type="text" maxlength="2400" placeholder="例如：验活、京豆日报，多个词用逗号分隔"><p class="small">勾选的类别从复盘列表隐藏，原记录完整保留。设置会在不同设备上记住。</p><div class="pref-bottom"><span id="filter-status" class="small" role="status"></span><button id="save-filters" type="button">保存过滤设置</button></div></details>
<form id="review-form" class="review"><label for="review">这一天，我想记下什么</label><p class="small">完成了什么 · 遇到的问题 · 明天怎么改</p><textarea id="review" maxlength="100000" placeholder="结合下面的提醒，写下你自己的判断和下一步…"></textarea><div class="review-bottom"><span id="review-status" class="small" role="status">正在读取复盘…</span><button id="save" class="primary" type="submit">保存复盘</button></div></form>
<div class="timeline-title"><h3>推送记录</h3><span id="count" class="small" aria-live="polite"></span></div>
<div id="messages" aria-live="polite"></div><div class="pager"><button id="more" type="button" hidden>加载更多</button></div>
<footer>仅登录后可见 · 时间按上海时区 · “推送服务已接受”表示服务端回执，设备实际展示由 Bark 决定。<br>完整正文与分段来源保留；历史导入记录保留原发送状态。</footer>
</main></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id), make=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n;};
let selected='',dirty=false,prefsDirty=false,offset=0,total=0,version=0,loading=false,days=[],savedPrefs={enabled:true,hiddenCategories:['jd','sf','ck'],hiddenKeywords:[]};
const statusNames={sent:'推送服务已接受',failed:'发送失败',unknown:'送达未确认',pending:'转发中',imported:'历史导入'};
function error(e){$('error').textContent=e.message||String(e);$('error').hidden=false;}
function clearError(){$('error').hidden=true;}
function fmt(ts){return ts?new Date(ts*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}):'';}
async function api(path,options={}){const c=new AbortController(),timer=setTimeout(()=>c.abort(),15000);try{const r=await fetch(path,{...options,credentials:'same-origin',cache:'no-store',signal:c.signal,headers:{Accept:'application/json',...(options.body?{'Content-Type':'application/json','X-Notifhub-Request':'1'}:{})}});if(r.redirected||r.status===401||r.status===403)throw new Error('请重新登录后查看；未保存的复盘仍在本页。');if(!(r.headers.get('content-type')||'').includes('application/json'))throw new Error('服务未返回数据，请稍后刷新。');const value=await r.json();if(!r.ok)throw new Error(typeof value.detail==='string'?value.detail:'请求失败（'+r.status+'）');return value;}catch(e){if(e.name==='AbortError')throw new Error('请求超时，请重试；未保存的文字仍在本页。');throw e;}finally{clearTimeout(timer);}}
function textWithLinks(parent,text){const pattern=/https?:\/\/[^\s<>"']+/g;let at=0;for(const m of String(text).matchAll(pattern)){parent.append(document.createTextNode(text.slice(at,m.index)));const raw=m[0],url=raw.replace(/[。，；、!?),;]+$/g,'');try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw new Error();const a=make('a','',url);a.href=u.href;a.rel='noopener noreferrer';a.target='_blank';parent.append(a,document.createTextNode(raw.slice(url.length)));}catch{parent.append(document.createTextNode(raw));}at=m.index+raw.length;}parent.append(document.createTextNode(text.slice(at)));}
function renderMessage(item){const card=make('article','message'),head=make('div','message-head');head.append(make('h3','',item.title),make('span','status '+item.status,statusNames[item.status]||item.status));card.append(head);const tags=make('div','tags');tags.append(make('span','pill',item.group_name),make('time','',item.date+' '+fmt(item.ts).split(' ').pop()),make('span','',item.source));if(item.hidden)tags.append(make('span','pill hidden-tag','不关心 · '+(item.hiddenReasons||[]).join('、')));card.append(tags);const subtitle=item.payload?.subtitle;if(subtitle)card.append(make('p','small',subtitle));const body=String(item.body||'');const n=make('div','body');textWithLinks(n,body.length>900?body.slice(0,900):body);card.append(n);if(body.length>900){const details=make('details',''),summary=make('summary','','展开其余正文 · 全文 '+body.length+' 字'),tail=make('div','body');textWithLinks(tail,body.slice(900));details.append(summary,tail);card.append(details);}if(item.payload?.origin){const detail=make('details','origin');detail.append(make('summary','','查看完整来源'),make('div','',JSON.stringify(item.payload.origin,null,2)));card.append(detail);}if(item.error)card.append(make('p','small','发送回执：'+item.error));$('messages').append(card);}
function filters(){const p=new URLSearchParams({offset:String(offset),limit:'50',visibility:'focus'});if(!$('all-dates').checked)p.set('date',selected);for(const id of ['q','group','source'])if($(id).value)p.set(id,$(id).value);return p;}
async function loadMessages(reset=true){if(loading&&!reset)return;loading=true;const current=++version;if(reset){offset=0;$('messages').replaceChildren();$('count').textContent='正在读取…';}else $('more').disabled=true;try{const result=await api('/api/bark/messages?'+filters());if(current!==version)return;total=result.total;for(const item of result.items)renderMessage(item);offset+=result.items.length;const hidden=result.hiddenTotal?' · '+result.hiddenTotal+' 条已过滤':'';$('count').textContent=(total?'已展示 '+offset+' / '+total+' 条':'没有匹配记录')+hidden;$('more').hidden=!result.hasMore;if(!offset)$('messages').append(make('div','empty',result.hiddenTotal?result.hiddenTotal+' 条提醒已过滤，关闭“过滤无关通知”即可查看。':'这一天还没有推送记录，或没有符合筛选条件的提醒。'));}catch(e){if(current===version)error(e);}finally{if(current===version){loading=false;$('more').disabled=false;}}}
function renderDates(){$('dates').replaceChildren();$('mobile-date').replaceChildren();const values=days.some(d=>d.date===selected)?days:[{date:selected,total:0},...days];for(const day of values){const b=make('button','daybtn');b.type='button';b.setAttribute('aria-current',day.date===selected?'date':'false');b.append(make('b','',day.date),make('span','small',day.total+' 条提醒'+(day.hidden?' · 过滤 '+day.hidden:'')+(day.reviewUpdated?' · 已复盘':'')));b.addEventListener('click',()=>selectDay(day.date));$('dates').append(b);const o=make('option','',day.date+' · '+day.total+' 条');o.value=day.date;$('mobile-date').append(o);}$('mobile-date').value=selected;}
async function loadReview(){const date=selected;const value=await api('/api/bark/review?date='+encodeURIComponent(date));if(date!==selected||dirty)return;$('review').value=value.text;$('review-status').textContent=value.updated?'已保存 · '+fmt(value.updated):'仅自己可见，保存到 '+date;}
async function selectDay(date){if(date!==selected&&dirty){error(new Error('当前复盘尚未保存，请先保存后切换日期。'));$('mobile-date').value=selected;return;}selected=date;clearError();$('date-title').textContent=date;$('date-info').textContent='按日期回看完整提醒';history.replaceState(null,'','?date='+date);renderDates();await Promise.all([loadMessages(),loadReview().catch(error)]);}
function options(id,values,label){const value=$(id).value;$(id).replaceChildren();const all=make('option','',label);all.value='';$(id).append(all);for(const item of values){const o=make('option','',item);o.value=item;$(id).append(o);}$(id).value=values.includes(value)?value:'';}
function renderPreferences(prefs){if(!prefs)return;savedPrefs={enabled:prefs.enabled!==false,hiddenCategories:prefs.hiddenCategories||[],hiddenKeywords:prefs.hiddenKeywords||[]};$('filter-unrelated').checked=savedPrefs.enabled;if(prefsDirty)return;$('hidden-categories').replaceChildren();for(const item of prefs.categories||[]){const label=make('label',''),input=make('input','');input.type='checkbox';input.value=item.id;input.checked=(prefs.hiddenCategories||[]).includes(item.id);input.addEventListener('change',()=>{prefsDirty=true;$('filter-status').textContent='设置尚未保存';});label.append(input,document.createTextNode(item.label));$('hidden-categories').append(label);}$('hidden-keywords').value=(prefs.hiddenKeywords||[]).join('，');}
async function refresh(){clearError();$('refresh').disabled=true;try{const value=await api('/api/bark/index');days=value.days;renderPreferences(value.filters);options('group',value.groups,'全部群组');options('source',value.sources,'全部来源');$('latest').textContent=(value.archiveTotal??value.total)+' 条归档'+(value.hiddenTotal?' · '+value.hiddenTotal+' 条已过滤':'')+(value.latest?' · 最近 '+fmt(value.latest):'');if(!selected){const fromURL=new URL(location.href).searchParams.get('date');selected=/^\d{4}-\d{2}-\d{2}$/.test(fromURL||'')?fromURL:value.today;}await selectDay(selected);}catch(e){error(e);}finally{$('refresh').disabled=false;}}
$('review').addEventListener('input',()=>{dirty=true;$('review-status').textContent='尚未保存';});
$('review-form').addEventListener('submit',async e=>{e.preventDefault();clearError();const date=selected,text=$('review').value;$('save').disabled=true;$('review-status').textContent='正在保存…';try{await api('/api/bark/review',{method:'POST',body:JSON.stringify({date,text})});if(date===selected&&text===$('review').value){dirty=false;await loadReview();}const d=days.find(d=>d.date===date);if(d)d.reviewUpdated=Date.now()/1000;renderDates();}catch(e){error(e);$('review-status').textContent='未确认保存；文字仍保留，请重试。';}finally{$('save').disabled=false;}});
$('filters').addEventListener('submit',e=>{e.preventDefault();clearError();loadMessages();});$('refresh').addEventListener('click',refresh);$('mobile-date').addEventListener('change',e=>selectDay(e.target.value));$('more').addEventListener('click',()=>loadMessages(false));
$('hidden-keywords').addEventListener('input',()=>{prefsDirty=true;$('filter-status').textContent='设置尚未保存';});
$('filter-unrelated').addEventListener('change',async()=>{const enabled=$('filter-unrelated').checked;$('filter-unrelated').disabled=true;clearError();try{const saved=await api('/api/bark/preferences',{method:'POST',body:JSON.stringify({...savedPrefs,enabled})});renderPreferences(saved);await refresh();}catch(e){error(e);$('filter-unrelated').checked=savedPrefs.enabled;}finally{$('filter-unrelated').disabled=false;}});
$('save-filters').addEventListener('click',async()=>{const fields=[...$('hidden-categories').querySelectorAll('input'),$('hidden-keywords')];const value={enabled:$('filter-unrelated').checked,hiddenCategories:fields.filter(n=>n.type==='checkbox'&&n.checked).map(n=>n.value),hiddenKeywords:$('hidden-keywords').value.split(/[,，;；\n]+/).map(s=>s.trim()).filter(Boolean)};clearError();$('save-filters').disabled=true;$('filter-unrelated').disabled=true;fields.forEach(n=>n.disabled=true);$('filter-status').textContent='正在保存…';try{const saved=await api('/api/bark/preferences',{method:'POST',body:JSON.stringify(value)});prefsDirty=false;renderPreferences(saved);$('filter-status').textContent='已保存，各设备同步使用';await refresh();}catch(e){error(e);$('filter-status').textContent='未确认保存；设置仍保留，请重试。';}finally{$('save-filters').disabled=false;$('filter-unrelated').disabled=false;fields.forEach(n=>n.disabled=false);}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});refresh();
</script></body></html>
